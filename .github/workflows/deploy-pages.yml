name: Deploy Ayushman Hospital Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect and build project
        shell: bash
        run: |
          set -e
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              npm run build
            fi
          fi

          if [ -d dist ]; then
            OUT=dist
          elif [ -d build ]; then
            OUT=build
          elif [ -d public ]; then
            OUT=public
          else
            OUT=.
          fi

          mkdir -p _site
          if [ "$OUT" = "." ]; then
            tar --exclude='./.git' --exclude='./node_modules' \
                --exclude='./_site' --exclude='./.github' \
                -cf - . | tar -xf - -C _site
          else
            cp -a "$OUT"/. _site/
          fi

          test -s _site/index.html
          echo "Website build verified."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish Ayushman Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --no-pub

      - name: Build Flutter Web
        run: flutter build web --release --base-href /Ayushman-Hospital-Book/

      - name: Verify SEO and build files
        run: |
          test -s build/web/index.html
          test -s build/web/sitemap.xml
          test -s build/web/robots.txt
          grep -q "AYUSHMAN SEO START" build/web/index.html
          python3 -c "import xml.etree.ElementTree as E; E.parse('build/web/sitemap.xml')"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

analyzer:
  exclude:
    - backup-original/**
    - .seo-backup/**
    - .workflow-backup/**
    - build/**
    - .dart_tool/**
    - linux/**
    - macos/**
    - windows/**
    - ios/**
    - android/**

  errors:
    # Silence deprecation notices (flutter/material.dart & withOpacity)
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
